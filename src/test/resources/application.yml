spring:
  datasource:
    url: jdbc:mysql://localhost:3307/coffee_shop_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  sql:
    init:
      mode: never

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

redisson:
  address: "redis://localhost:6379"

data-platform:
  api:
    url: http://localhost:${wiremock.server.port:8089}/mock/data-platform

app:
  scheduling:
    enabled: false

springdoc:
  swagger-ui:
    enabled: false
